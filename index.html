<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta http-equiv="Content-Security-Policy" content="camera 'self'; microphone 'self'" />

    <!-- A-Frame -->
    <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>

    <!-- MindAR -->
    <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>

    <script>
      // Debug script loading
      window.addEventListener('load', function() {
        console.log('Page loaded');
        if (typeof AFRAME !== 'undefined') {
          console.log('A-Frame loaded:', AFRAME.version);
        } else {
          console.error('A-Frame not loaded');
        }

        if (typeof window.MINDAR !== 'undefined') {
          console.log('MindAR loaded');
        } else {
          console.error('MindAR not loaded');
        }
      });
    </script>

    <title>AR Project</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
